name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layout-and-translations:
    name: Layout, translation and Colab checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      # These checks parse files, validate translations and exercise Colab backup
      # contracts with short-lived subprocesses. They need no MuJoCo or GPU stack.
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Check layout, translations and Colab helpers
        run: python -m pytest tests/test_layout.py tests/test_translations.py tests/test_colab.py tests/test_colab_metrics.py -q
