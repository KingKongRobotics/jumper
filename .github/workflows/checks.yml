name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layout-and-translations:
    name: Layout and translation checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      # These checks parse repository files and validate translation stamps; they
      # intentionally do not install or exercise the MuJoCo, Warp, or GPU stack.
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Check layout and translations
        run: python -m pytest tests/test_layout.py tests/test_translations.py -q

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      # The rule set is written into pyproject.toml, so the ruff version is not
      # what decides what passes here; CONTRIBUTING.md asks for this command
      # before handing a change over, and this is the same command.
      - name: Install ruff
        run: python -m pip install --disable-pip-version-check ruff

      - name: Lint
        run: python -m ruff check .

  framework-tests:
    name: Framework tests (native backend, CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # The whole suite on the native CPU backend: the seam, the vendored
      # copies, the registry, the task contracts, export and the bundle checks.
      # No GPU, so warp lists ['cpu'] alone and the warp-side tests skip, and no
      # cargo, so the controller's own tests skip too -- what runs here is the
      # Python half, which until this job ran nowhere but on a developer's
      # machine. The CPU torch wheel keeps the install under the runner's disk.
      #
      # mjlab sets MUJOCO_GL=egl on Linux before mujoco is imported, so every
      # test that imports a task needs an EGL the loader can find, GPU or not:
      # Mesa's. Without it collection fails on 29 files with
      # `'NoneType' object has no attribute 'eglQueryString'` (measured in a
      # python:3.12-slim container on 2026-10-08; the packages below fixed it).
      - name: Install Mesa EGL for headless rendering
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libegl-mesa0 libgl1-mesa-dri

      - name: Install PyTorch (CPU build)
        run: python -m pip install --disable-pip-version-check torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install this repository
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      # Three invocations rather than one, by peak memory. The suite's memory
      # accumulates across a session -- environments freed by their module's
      # fixtures are not returned to the OS -- and one process running all of
      # it peaked at 13.6 GB on a 64 GB machine (macOS, 2026-10-08), against
      # the 16 GB of a hosted runner. Measured apart: every file but two stays
      # under 3.5 GB and the rest of the suite together peaks at 6.2 GB;
      # test_swing_task.py and test_replay.py peak at 4.6 and 4.4 GB alone and
      # at 9.7 GB in one process. So each of those two runs by itself.
      - name: Run the suite (all but the two memory-heavy files)
        run: python -m pytest tests/ --ignore=tests/test_swing_task.py --ignore=tests/test_replay.py -q

      - name: Run test_swing_task.py
        run: python -m pytest tests/test_swing_task.py -q

      - name: Run test_replay.py
        run: python -m pytest tests/test_replay.py -q
